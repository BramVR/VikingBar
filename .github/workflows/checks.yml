name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: VikingBar checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify hosted toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version | grep -Fx 'Xcode 26.2'
          swift --version | grep -F 'Apple Swift version 6.2.3 '
      - name: Install pinned tools
        run: ./Scripts/bootstrap-ci-tools.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/arm64-apple-macosx
          key: swiftpm-macos15-${{ runner.os }}-${{ runner.arch }}-xcode26.2-swift6.2.3-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Run shared gates
        run: ./Scripts/ci-build.sh
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VikingBar-${{ github.sha }}
          path: .build/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VikingBar-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/ci-logs/
          if-no-files-found: warn
          retention-days: 14
